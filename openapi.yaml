openapi: 3.1.0
info:
  title: Splatter API
  version: 1.0.0
  description: Create splats and upload large source files through presigned part URLs.
servers:
  - url: https://new.splatter.app/api/v1
security:
  - bearerAuth: []
paths:
  /splats:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: createSplat
      summary: Create a splat and its source upload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSplatRequest"
      responses:
        "201":
          description: Splat and upload created, or an identical request replayed
          headers:
            Cache-Control:
              schema:
                type: string
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSplatResponse"
              examples:
                created:
                  value:
                    splat:
                      publicId: abc-123-xyz
                      status: uploading
                    upload:
                      partSizeBytes: 134217728
                      partCount: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /splats/{publicId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getSplat
      summary: Get an owned splat and its ready-scene bootstrap
      parameters:
        - $ref: "#/components/parameters/PublicId"
      responses:
        "200":
          description: Owned splat detail
          headers:
            Cache-Control:
              description: Owner responses are never shared or cached
              schema:
                type: string
                const: private, no-store
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSplatResponse"
              examples:
                processing:
                  summary: Polling while processing is active
                  value:
                    splat:
                      publicId: abc-123-xyz
                      title: Scan
                      description: null
                      visibility: unlisted
                      status: processing
                      viewerConfig: null
                      createdAt: "2026-11-19T12:00:00Z"
                      updatedAt: "2026-11-19T12:01:00Z"
                    scene: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      operationId: updateSplat
      summary: Update one or more editable fields on an owned splat
      parameters:
        - $ref: "#/components/parameters/PublicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSplatRequest"
      responses:
        "200":
          description: Updated owned splat detail
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerSplatResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: deleteSplat
      summary: Soft-delete an owned splat
      parameters:
        - $ref: "#/components/parameters/PublicId"
      responses:
        "204":
          description: Splat deleted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
  /splats/{publicId}/upload/part-authorizations:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: authorizeUploadParts
      summary: Create short-lived upload URLs for source parts
      parameters:
        - $ref: "#/components/parameters/PublicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartAuthorizationsRequest"
      responses:
        "200":
          description: Part authorizations
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartAuthorizationsResponse"
              examples:
                onePart:
                  value:
                    parts:
                      - partNumber: 1
                        url: https://storage.example/presigned-part-credential
                        expiresAt: "2026-11-19T12:05:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /splats/{publicId}/upload/completion:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: completeUpload
      summary: Complete a source upload and begin processing
      parameters:
        - $ref: "#/components/parameters/PublicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCompletionRequest"
      responses:
        "200":
          description: Current splat state
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplatStatusResponse"
              examples:
                processing:
                  value:
                    splat:
                      publicId: abc-123-xyz
                      status: processing
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          $ref: "#/components/responses/ServerError"
        "503":
          $ref: "#/components/responses/ServerError"
  /splats/{publicId}/upload/abort:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: abortUpload
      summary: Abort an active source upload
      parameters:
        - $ref: "#/components/parameters/PublicId"
      responses:
        "200":
          description: Aborted splat
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplatStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal API token created in Splatter settings.
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller correlation ID; invalid values are replaced
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    PublicId:
      name: publicId
      in: path
      required: true
      schema:
        type: string
  schemas:
    UpdateSplatRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        visibility:
          type: string
          enum: [public, unlisted]
        viewerConfig:
          $ref: "#/components/schemas/ViewerConfigInput"
    OwnerSplatResponse:
      type: object
      required: [splat, scene]
      properties:
        splat:
          $ref: "#/components/schemas/OwnerSplat"
        scene:
          oneOf:
            - $ref: "#/components/schemas/EditorScene"
            - type: "null"
    OwnerSplat:
      type: object
      required:
        - createdAt
        - description
        - publicId
        - status
        - title
        - updatedAt
        - viewerConfig
        - visibility
      properties:
        createdAt:
          type: string
          format: date-time
        description:
          type: [string, "null"]
        publicId:
          type: string
        status:
          $ref: "#/components/schemas/SplatStatusValue"
        title:
          type: string
        updatedAt:
          type: string
          format: date-time
        viewerConfig:
          oneOf:
            - $ref: "#/components/schemas/ViewerConfig"
            - type: "null"
        visibility:
          $ref: "#/components/schemas/SplatVisibility"
    EditorScene:
      type: object
      required: [datasetBaseUrl, description, publicId, title, viewerConfig]
      properties:
        datasetBaseUrl:
          type: string
          format: uri
        description:
          type: [string, "null"]
        publicId:
          type: string
        title:
          type: string
        viewerConfig:
          oneOf:
            - $ref: "#/components/schemas/ViewerConfig"
            - type: "null"
    ViewerConfig:
      type: object
      required: [version, defaultView, upDirection, backgroundColor, fov]
      properties:
        version:
          type: integer
          const: 1
        defaultView:
          oneOf:
            - type: array
              minItems: 6
              maxItems: 6
              items:
                type: number
            - type: "null"
        upDirection:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        backgroundColor:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            minimum: 0
            maximum: 1
        fov:
          type: number
          minimum: 20
          maximum: 110
    ViewerConfigInput:
      type: object
      additionalProperties: false
      required: [version, defaultView, upDirection, backgroundColor, fov]
      properties:
        version:
          type: integer
          const: 1
        defaultView:
          oneOf:
            - type: array
              minItems: 6
              maxItems: 6
              items:
                type: number
            - type: "null"
        upDirection:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
        backgroundColor:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
            minimum: 0
            maximum: 1
        fov:
          type: number
          minimum: 20
          maximum: 110
    SplatStatusValue:
      type: string
      enum: [created, uploading, uploaded, processing, ready, failed]
    SplatVisibility:
      type: string
      enum: [private, unlisted, public]
    CreateSplatRequest:
      type: object
      additionalProperties: false
      required: [title, visibility, source]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        visibility:
          type: string
          enum: [public, unlisted]
        source:
          type: object
          additionalProperties: false
          required: [filename, format, sizeBytes, gaussianCount]
          properties:
            filename:
              type: string
              minLength: 1
            format:
              type: string
              enum: [ply]
            sizeBytes:
              type: integer
              minimum: 1
              maximum: 536870912000
            gaussianCount:
              type: integer
              minimum: 1
    CreateSplatResponse:
      type: object
      required: [splat, upload]
      properties:
        splat:
          $ref: "#/components/schemas/SplatStatus"
        upload:
          type: object
          required: [partSizeBytes, partCount]
          properties:
            partSizeBytes:
              type: integer
              minimum: 1
            partCount:
              type: integer
              minimum: 1
              maximum: 4000
    PartAuthorizationsRequest:
      type: object
      additionalProperties: false
      required: [partNumbers]
      properties:
        partNumbers:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 4000
    PartAuthorizationsResponse:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items:
            type: object
            required: [partNumber, url, expiresAt]
            properties:
              partNumber:
                type: integer
              url:
                type: string
                format: uri
              expiresAt:
                type: string
                format: date-time
    UploadCompletionRequest:
      type: object
      additionalProperties: false
      required: [parts]
      properties:
        parts:
          type: array
          minItems: 1
          maxItems: 4000
          items:
            type: object
            additionalProperties: false
            required: [partNumber, etag]
            properties:
              partNumber:
                type: integer
                minimum: 1
                maximum: 4000
              etag:
                type: string
                minLength: 1
                maxLength: 1024
    SplatStatusResponse:
      type: object
      required: [splat]
      properties:
        splat:
          $ref: "#/components/schemas/SplatStatus"
    SplatStatus:
      type: object
      required: [publicId, status]
      properties:
        publicId:
          type: string
        status:
          $ref: "#/components/schemas/SplatStatusValue"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - AUTHENTICATION_REQUIRED
                - IDEMPOTENCY_CONFLICT
                - INTERNAL_ERROR
                - INVALID_REQUEST
                - MALFORMED_JSON
                - RATE_LIMITED
                - SPLAT_NOT_FOUND
                - TEMPORARY_UNAVAILABLE
                - UNSUPPORTED_MEDIA_TYPE
                - UPLOAD_STATE_CONFLICT
                - UPSTREAM_FAILURE
            message:
              type: string
            requestId:
              type: string
            fields:
              type: array
              items:
                type: object
                required: [path, message]
                properties:
                  path:
                    type: string
                  message:
                    type: string
  headers:
    RequestId:
      description: Correlation ID assigned to this response
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Splat not found
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Idempotency or upload-state conflict
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Request body is not JSON
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Approximate per-owner request limit exceeded
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying
          required: true
          schema:
            type: integer
            const: 60
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Temporary or internal failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
